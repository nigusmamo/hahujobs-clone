query GetSectorJobs($where: jobs_bool_exp, $limit: Int, $offset: Int) {
  jobs: search_jobs(
    where: $where

    limit: $limit

    offset: $offset

    order_by: [{ priority: desc_nulls_last }, { deadline: asc }]
  ) {
    id

    title

    type

    salary

    deadline

    total_web_view_count

    salary

    summary

    location

    entity {
      name
      logo
    }

    job_cities {
      city {
        name
        region {
          name
          id
        }
      }
    }

    sub_sector {
      name
      sector {
        name
        id
        icon_class
        icon_code
      }
    }
  }
}
